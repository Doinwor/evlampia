        };

        let LANG = localStorage.getItem('i-lang') || 'ru';

        function setLang(lang) {
            if (!i18n[lang]) return;
            LANG = lang;
            try { localStorage.setItem('i-lang', lang); } catch(e){}
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang][key]) el.innerHTML = i18n[lang][key];
            });
            document.getElementById('currentLang').textContent = lang.toUpperCase();
            document.querySelectorAll('.lang-option').forEach(opt => {
                opt.classList.toggle('active', opt.dataset.lang === lang);
            });
            document.documentElement.setAttribute('lang', lang);
            if (i18n[lang].doc_title) document.title = i18n[lang].doc_title;
            buildGrid();
        }

        document.getElementById('langBtn').addEventListener('click', e => {
            e.stopPropagation();
            document.getElementById('langSwitcher').classList.toggle('open');
        });
        document.getElementById('langMore').addEventListener('click', e => {
            e.stopPropagation();
            document.getElementById('langSwitcher').classList.toggle('more-open');
        });
        document.addEventListener('click', () => document.getElementById('langSwitcher').classList.remove('open'));
        document.querySelectorAll('.lang-option').forEach(opt => {
            opt.addEventListener('click', e => {
                e.stopPropagation();
                setLang(opt.dataset.lang);
                document.getElementById('langSwitcher').classList.remove('open');
            });
        });

        const toggleBtn = document.getElementById('themeToggle');
        const root = document.documentElement;
        const storedTheme = localStorage.getItem('i-theme');
        if (storedTheme) root.setAttribute('data-theme', storedTheme);
        toggleBtn.addEventListener('click', () => {
            const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            localStorage.setItem('i-theme', next);
        });

        function vId(it) { return it.id || String(it.file || '').replace(/\.[^.]+$/, ''); }
        function vTitle(it) { return (it.titles && it.titles[LANG]) || it.title || it.file; }

        function buildGrid() {
            let data = null;
            try { data = window.EVLAMPIA_VIDEOS; } catch (e) {}
            const list = Array.isArray(data) ? data.filter(v => v && v.file) : [];
            document.getElementById('vgLoading').style.display = 'none';
            const grid = document.getElementById('vGrid');
            grid.innerHTML = '';
            list.forEach(item => {
                const a = document.createElement('a');
                a.className = 'vcard';
                a.href = 'player.html?v=' + encodeURIComponent(vId(item));
                const thumb = document.createElement('div');
                thumb.className = 'vthumb';
                if (item.thumb) {
                    const img = document.createElement('img');
                    img.src = item.thumb;
                    img.alt = '';
                    img.loading = 'lazy';
                    thumb.appendChild(img);
                }
                const badge = document.createElement('div');
                badge.className = 'play-badge';
                badge.textContent = '▶';
                thumb.appendChild(badge);
                const meta = document.createElement('div');
                meta.className = 'vmeta';
                const t = document.createElement('div');
                t.className = 'vtitle';
                t.textContent = vTitle(item);
                const ext = document.createElement('div');
                ext.className = 'vext';
                ext.textContent = (String(item.file).split('.').pop() || '').toUpperCase() + ' · і.';
                meta.appendChild(t);
                meta.appendChild(ext);
                a.appendChild(thumb);
                a.appendChild(meta);
                grid.appendChild(a);
            });
        }

        setLang(LANG);
    </script>
<style>
[data-reveal]{opacity:0;transform:translateY(24px);transition:opacity 0.7s ease,transform 0.7s ease;will-change:opacity,transform}
[data-reveal].is-visible{opacity:1;transform:none}
</style>
<script>
(function(){var els=document.querySelectorAll('[data-reveal]');if(!els.length||!("IntersectionObserver" in window)){els.forEach(function(e){e.classList.add("is-visible")});return}
var io=new IntersectionObserver(function(entries){entries.forEach(function(en){if(en.isIntersecting){en.target.classList.add("is-visible");io.unobserve(en.target)}})},{threshold:0.12,rootMargin:"0px 0px -40px 0px"})
els.forEach(function(e){io.observe(e)})})();
</script>
</body>
</html>
